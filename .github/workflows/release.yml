# Release on a v* tag (pushed after `version:bump` + the `chore(release): vX.Y.Z` commit): full CI,
# then the web app tarball (atlas-vault-web-X.Y.Z.tar.gz + .sha256), the Android APK and AAB
# signed with the upload key, and the third-party notices, then a GitHub Release
# "Atlas Vault vX.Y.Z" carrying the tag's RELEASE_NOTES.md section, every artifact, their build
# provenance attestations and SHA256SUMS.txt.
#
# Android: the APK and AAB are attached to the release. The Google Play upload is off until the
# app has a Play listing: set the repository variable PLAY_UPLOAD to `true` (and the
# GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret) to turn it on. Without the four ANDROID_* keystore
# secrets the release still ships the web app, with no Android build (never a debug-signed one).
#
# A tag with a "-" (vX.Y.Z-rc.N, tagged by hand on dev) is a pre-release: a GitHub prerelease that
# is never "latest", and the AAB goes to the Play internal track when the upload is on.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # Bun is pinned in lockstep with ci.yml and devenv -- bump them together.
  BUN_VERSION: "1.4.2"
  NODE_VERSION: "26"

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

  # Fails fast, before anything is built, on a tag that doesn't match the manifests or missing
  # release notes; says whether the Android build can be signed.
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    # The signing and Play secrets can live in the `release` environment, which only v* tags may use.
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      android: ${{ steps.keystore.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches the manifests
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest="$(jq -r .version package.json)"
          if [ "$version" != "$manifest" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($manifest). Run version:bump before tagging."
            exit 1
          fi
          app="$(jq -r .expo.version apps/vault/app.json)"
          code="$(jq -r .expo.android.versionCode apps/vault/app.json)"
          want="$(node scripts/version-code.mjs "$version")"
          if [ "$app" != "$version" ] || [ "$code" != "$want" ]; then
            echo "::error::apps/vault/app.json has version $app / versionCode $code; expected $version / $want. Run version:bump."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - name: Extract the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v heading="## v$VERSION" '
            { line = $0; sub(/[ \t\r]+$/, "", line) }
            line == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' RELEASE_NOTES.md > release-notes.md || {
            echo "::error::RELEASE_NOTES.md has no '## v$VERSION' section. Regenerate it with scripts/release-notes.sh."
            exit 1
          }
          cat release-notes.md
      - name: Check the Android upload keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::warning::No Android build: missing secrets ${missing[*]} (the upload keystore)."
            echo "android=false" >> "$GITHUB_OUTPUT"
          else
            echo "android=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7

  web:
    name: Web app tarball
    needs: [ci, prepare]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Build
        env:
          # Built for a server that serves its API at /api on the page's origin; the sign-in
          # screen lets a user name another.
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || '/api' }}
          EXPO_PUBLIC_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: scripts/web-release-tarball.sh dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: |
            dist/atlas-vault-web-${{ env.VERSION }}.tar.gz
            dist/atlas-vault-web-${{ env.VERSION }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android APK + AAB
    needs: [ci, prepare]
    if: ${{ needs.prepare.outputs.android == 'true' }}
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      # Fork overrides read by apps/vault/app.config.ts. An unset variable arrives empty, which
      # means the maintainer's defaults.
      ATLAS_APP_ID: ${{ vars.ATLAS_APP_ID }}
      ATLAS_EAS_PROJECT_ID: ${{ vars.ATLAS_EAS_PROJECT_ID }}
      EXPO_PUBLIC_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Toolchain, deps and the build caches (written on main by android-cache.yml, read here).
      - uses: ./.github/actions/android-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          bun-version: ${{ env.BUN_VERSION }}
      - name: Decode the upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        # Tolerates line-wrapped or unpadded base64 as pasted into the secret.
        run: |
          python3 -c 'import base64, os, re, sys; s = re.sub(r"[^A-Za-z0-9+/=]", "", os.environ["ANDROID_KEYSTORE_BASE64"]); s += "=" * (-len(s) % 4); open(sys.argv[1], "wb").write(base64.b64decode(s))' \
            "$RUNNER_TEMP/upload.keystore"
          echo "KEYSTORE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
      - name: Build the signed APK and AAB
        working-directory: apps/vault/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # AGP's injected signing config signs both outputs with the upload key; the prebuilt
        # project's own release config is the debug key. The shared script keeps the flags
        # identical to the cache-filling build.
        run: |
          ../../../.github/scripts/android-gradle.sh \
            -Pandroid.injected.signing.store.file="$KEYSTORE" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
      # A dependency update can add a permission without anyone noticing: only what
      # docs/android-permissions.md lists may ship.
      - name: Check the declared permissions
        run: node apps/vault/scripts/check-android-permissions.mjs
      - name: Verify both are signed with the upload key
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          outputs=apps/vault/android/app/build/outputs
          apk="$outputs/apk/release/app-release.apk"
          aab="$outputs/bundle/release/app-release.aab"
          build_tools="$(find -L "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          fp() { tr -d ':' | tr '[:upper:]' '[:lower:]'; }
          expected="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | awk '/SHA256:/ { print $2; exit }' | fp)"
          apk_fp="$("$build_tools/apksigner" verify --print-certs "$apk" | awk '/certificate SHA-256 digest/ { print $NF; exit }' | fp)"
          aab_fp="$(keytool -printcert -jarfile "$aab" | awk '/SHA256:/ { print $2; exit }' | fp)"
          echo "upload key: $expected"; echo "APK:        $apk_fp"; echo "AAB:        $aab_fp"
          if [ -z "$expected" ] || [ "$apk_fp" != "$expected" ] || [ "$aab_fp" != "$expected" ]; then
            echo "::error::The APK or AAB is not signed with the upload keystore."
            exit 1
          fi
          mkdir -p dist
          cp "$apk" "dist/atlas-vault-$VERSION.apk"
          cp "$aab" "dist/atlas-vault-$VERSION.aab"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Upload to Google Play
        # Off until the app has a Play listing (repository variable PLAY_UPLOAD=true).
        if: ${{ vars.PLAY_UPLOAD == 'true' }}
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_STORE_TRACK: ${{ needs.prepare.outputs.prerelease == 'true' && (vars.PLAY_STORE_PRERELEASE_TRACK || 'internal') || format('{0},internal', vars.PLAY_STORE_TRACK || 'internal') }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_UPLOAD is on but GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not set."
            exit 1
          fi
          node apps/vault/scripts/upload-play-store.mjs "dist/atlas-vault-$VERSION.aab" "$PLAY_STORE_TRACK"
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"

  notices:
    name: Third-party notices
    needs: [ci, prepare]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Only the package.json files are read: no install scripts.
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: node scripts/third-party-licenses.mjs --notices THIRD_PARTY_NOTICES.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-notices
          path: THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: GitHub Release
    needs: [prepare, web, android, notices]
    # The Android job is skipped without the keystore; the release ships without it then.
    if: ${{ !cancelled() && needs.web.result == 'success' && needs.notices.result == 'success' && (needs.android.result == 'success' || needs.android.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{release-notes,android,web,third-party-notices}"
          path: dist
          merge-multiple: true
      # Verify a download with: gh attestation verify <file> --repo atlastodo/atlas-vault
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.apk
            dist/*.aab
            dist/*.tar.gz
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          cd dist
          mv release-notes.md ../release-notes.md
          sha256sum -- * > SHA256SUMS.txt
          tag="$GITHUB_REF_NAME"
          if [ "$PRERELEASE" = true ]; then
            flags=(--prerelease --latest=false)
          else
            flags=(--prerelease=false --latest)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Atlas Vault $tag" --notes-file ../release-notes.md "${flags[@]}"
            gh release upload "$tag" --clobber -- *
          else
            gh release create "$tag" --verify-tag --title "Atlas Vault $tag" \
              --notes-file ../release-notes.md "${flags[@]}" -- *
          fi
