# Weekly dependency updates. Minor/patch bumps arrive as one grouped PR per ecosystem; majors
# stay separate so each gets its own review. Commit prefixes follow Conventional Commits.
#
# Version updates target `dev`, where work lands (`main` takes only the release PR from dev).
# Security updates (a repository setting, not this file) always target the default branch, `main`.
# A bun PR's `nix/bun.nix` is regenerated by the `Dependabot bun.nix` workflow.
version: 2
updates:
  - package-ecosystem: github-actions
    # The root covers .github/workflows; the composite actions need listing.
    directories: ["/", "/.github/actions/*"]
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # Bun workspace (root bun.lock covers apps/*). Bun itself is pinned in lockstep across devenv and
  # the workflows, so Dependabot doesn't touch it. The core package (@atlastodo/client-core) is pinned
  # to an exact core release and moves by hand, with that release.
  - package-ecosystem: bun
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      bun-minor-patch:
        update-types: [minor, patch]
    # The Expo SDK pins these to the versions it was built and tested with (its
    # bundledNativeModules.json, `expo install --check`): they move with an SDK upgrade, never one
    # by one. jest stays on the major jest-expo supports.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "@atlastodo/*"
      - dependency-name: "jest-expo"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-dom"
      - dependency-name: "react-native"
      - dependency-name: "@react-native/*"
      - dependency-name: "react-native-web"
      - dependency-name: "react-native-screens"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: "jest"
      - dependency-name: "babel-jest"
      - dependency-name: "@types/jest"
