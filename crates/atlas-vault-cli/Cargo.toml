[package]
name = "atlas-vault-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "The `atlas-vault` command line: Atlas Vault for scripts, CI and n8n, end-to-end encrypted, one static binary."

[[bin]]
name = "atlas-vault"
path = "src/main.rs"

[dependencies]
atlas-client = { workspace = true }
atlas-vault-rules = { path = "../atlas-vault-rules" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
atlas-core = { workspace = true }
uuid = { workspace = true }
hex = "0.4"
